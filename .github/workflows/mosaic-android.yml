name: MOSAIC Android APK

on:
  push:
    branches: [main]
    paths:
      - "mosaic/**"
      - ".github/workflows/mosaic-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MOSAIC debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build MOSAIC APK
        run: gradle --no-daemon -p mosaic/android assembleDebug

      - name: Upload MOSAIC APK
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-debug-apk
          path: mosaic/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
