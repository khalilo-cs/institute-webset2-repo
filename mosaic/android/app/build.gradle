plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "ai.mosaic.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "ai.mosaic.mobile"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        // Python 3.13 is available for 64-bit Android ABIs.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copy only the authoritative Python package and its UI assets into a clean,
// isolated source directory. This prevents Gradle's own build output folders
// from being scanned as Python input files.
def syncMosaicPython = tasks.register("syncMosaicPython", Sync) {
    from("../../mosaic") {
        include "*.py"
        include "static/**"
        into "mosaic"
    }
    into("../python-src")
}

chaquopy {
    defaultConfig {
        version = "3.13"
    }
    sourceSets {
        main {
            srcDir("../python-src")
        }
    }
}

// Chaquopy's source-merging task must run after the package sync task.
tasks.configureEach {
    if (name != "syncMosaicPython" && name.toLowerCase().contains("python")) {
        dependsOn(syncMosaicPython)
    }
}
